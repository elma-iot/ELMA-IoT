name: PlatformIO CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend build dependencies
        run: npm ci
      - name: Install PlatformIO
        run: pip install platformio
      - name: Validate project version
        run: python scripts/project_version.py
      - name: Wi-Fi power regression tests
        run: |
          node --test tests/wifi-power.test.mjs
          python -m unittest discover -s tests -p test_wifi_power_defaults.py
          g++ -std=c++17 tests/wifi_power_policy_test.cpp -o /tmp/wifi_power_policy_test
          /tmp/wifi_power_policy_test
      - name: Validate portable reduced builder version path
        run: |
          mkdir -p .portable-builder-validation/include
          cp include/version.h .portable-builder-validation/include/version.h
          ELMA_PORTABLE_BUILDER=1 python scripts/project_version.py --project-dir .portable-builder-validation
      - name: Build default environment
        run: pio run

  release-assets:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: waveshare_amoled_191
            boardId: '33'
            asset: elma-esp32s3-board33-${{ github.event.release.tag_name }}.bin
          - env: esp32_notifier
            asset: esp32-notifier-${{ github.event.release.tag_name }}.bin
          - env: esp32_notifier_hacs
            asset: esp32-notifier-hacs-${{ github.event.release.tag_name }}.bin
          - env: esp32_notifier_hacs_slim
            asset: esp32-notifier-hacs-slim-${{ github.event.release.tag_name }}.bin
          - env: esp32s3_notifier
            asset: esp32s3-notifier-${{ github.event.release.tag_name }}.bin
          - env: esp32s3_notifier_hacs
            asset: esp32s3-notifier-hacs-${{ github.event.release.tag_name }}.bin
          - env: esp32s3_notifier_hacs_slim
            asset: esp32s3-notifier-hacs-slim-${{ github.event.release.tag_name }}.bin
          - env: esp32c3_designer_hacs
            asset: esp32c3-notifier-hacs-${{ github.event.release.tag_name }}.bin
          - env: esp32_ota_bridge
            asset: esp32-ota-bridge-${{ github.event.release.tag_name }}.bin
          - env: esp32s3_ota_bridge
            asset: esp32s3-ota-bridge-${{ github.event.release.tag_name }}.bin
          - env: esp32c3_ota_bridge
            asset: esp32c3-ota-bridge-${{ github.event.release.tag_name }}.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend build dependencies
        run: npm ci
      - name: Install PlatformIO
        run: pip install platformio
      - name: Validate release tag and firmware version
        run: python scripts/project_version.py --tag "${{ github.event.release.tag_name }}"
      - name: Build release firmware
        env:
          ELMA_SELECTED_BOARD_PROFILE_ID: ${{ matrix.boardId || startsWith(matrix.env, 'esp32c3') && '11' || startsWith(matrix.env, 'esp32s3') && '1' || '8' }}
        run: pio run -e ${{ matrix.env }}
      - name: Stage OTA asset
        run: |
          mkdir -p dist
          cp .pio/build/${{ matrix.env }}/firmware.bin dist/${{ matrix.asset }}
      - name: Upload OTA asset to release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          files: dist/${{ matrix.asset }}

  release-flasher:
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend and firmware build dependencies
        run: |
          npm ci
          python -m pip install platformio
      - name: Validate release tag and application versions
        run: python scripts/project_version.py --tag "${{ github.event.release.tag_name }}"
      - name: Build embedded ESP32 support images
        run: pio run -e esp32_notifier -e esp32s3_notifier -e esp32c3_designer_hacs
      - name: Build portable ELMA Flasher
        shell: powershell
        run: .\scripts\build_elma_flasher.ps1
      - name: Validate packaged ELMA Flasher
        shell: powershell
        run: |
          $process = Start-Process -FilePath ".\release-assets\${{ github.event.release.tag_name }}\ELMA-Flasher-${{ github.event.release.tag_name }}.exe" -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "ELMA Flasher self-test failed with exit code $($process.ExitCode)." }
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $warm = Start-Process -FilePath ".\release-assets\${{ github.event.release.tag_name }}\ELMA-Flasher-${{ github.event.release.tag_name }}.exe" -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          $watch.Stop()
          if ($warm.ExitCode -ne 0) { throw "Warm ELMA Flasher self-test failed with exit code $($warm.ExitCode)." }
          if ($watch.Elapsed.TotalSeconds -gt 10) { throw "Warm ELMA Flasher startup took $([math]::Round($watch.Elapsed.TotalSeconds, 2)) seconds." }
          $primary = Start-Process -FilePath ".\release-assets\${{ github.event.release.tag_name }}\ELMA-Flasher-${{ github.event.release.tag_name }}.exe" -ArgumentList '--launcher-instance-hold-test' -WindowStyle Hidden -PassThru
          Start-Sleep -Milliseconds 400
          $watch.Restart()
          $secondary = Start-Process -FilePath ".\release-assets\${{ github.event.release.tag_name }}\ELMA-Flasher-${{ github.event.release.tag_name }}.exe" -ArgumentList '--launcher-instance-hold-test' -WindowStyle Hidden -Wait -PassThru
          $watch.Stop()
          if ($secondary.ExitCode -ne 0 -or $watch.Elapsed.TotalSeconds -gt 2 -or $primary.HasExited) { throw 'ELMA Flasher single-instance gate failed.' }
          $primary.WaitForExit()
          if ($primary.ExitCode -ne 0) { throw "ELMA Flasher instance hold test failed with exit code $($primary.ExitCode)." }
          $designer = Start-Process -FilePath ".\release-assets\${{ github.event.release.tag_name }}\ELMA-Flasher-${{ github.event.release.tag_name }}.exe" -ArgumentList '--native-designer-smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($designer.ExitCode -ne 0) { throw "Bundled ELMA Device Designer test failed with exit code $($designer.ExitCode)." }
          $builder = Start-Process -FilePath ".\release-assets\${{ github.event.release.tag_name }}\ELMA-Flasher-${{ github.event.release.tag_name }}.exe" -ArgumentList '--portable-builder-compile-test' -WindowStyle Hidden -Wait -PassThru
          if ($builder.ExitCode -ne 0) { throw "Packaged portable firmware compilation test failed with exit code $($builder.ExitCode)." }
      - name: Upload ELMA Flasher to release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          files: release-assets/${{ github.event.release.tag_name }}/ELMA-Flasher-${{ github.event.release.tag_name }}.exe
