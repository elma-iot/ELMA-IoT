extends = env:esp32_designer_noaudio
build_flags =
    ${env:esp32_designer_noaudio.build_flags}
    -DAPP_DISABLE_WEB_UI=1

[env:esp32_designer_noaudio_hacs_slim]
extends = env:esp32_designer_noaudio_hacs
build_flags =
    ${env:esp32_designer_noaudio_hacs.build_flags}
    -DAPP_DISABLE_WEB_UI=1

[env:esp32_notifier_slim]
extends = env:esp32_notifier
build_flags =
    ${env:esp32_notifier.build_flags}
    -DAPP_DISABLE_WEB_UI=1

[env:esp32s3_designer_noaudio]
extends = env:esp32s3_notifier
build_src_filter = +<*> -<audio_player.cpp>
build_flags =
    ${env:esp32s3_notifier.build_flags}
    -DAPP_DISABLE_AUDIO=1

