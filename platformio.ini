[minimal_ota_bridge_base]
platform = espressif32 @ ^6.7.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions/ota_4m.csv
build_src_filter = -<*> +<minimal_ota_bridge.cpp>
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.7.6
    bblanchon/ArduinoJson @ ^7.1.0
build_flags =
    ${common.common_build_flags}
    -DAPP_MINIMAL_OTA_BRIDGE=1
    -DAPP_DEBUG=0
build_unflags =
    -std=gnu++11
extra_scripts =
    pre:scripts/project_version.py
board_build.cmake_extra_args =
    ${common.common_cmake_extra_args}

[env:esp32_ota_bridge]
extends = minimal_ota_bridge_base
board = esp32dev

[env:esp32s3_ota_bridge]
extends = minimal_ota_bridge_base
board = esp32-s3-devkitm-1
monitor_rts = 0
monitor_dtr = 0
board_upload.flash_size = 4MB
build_flags =
    ${minimal_ota_bridge_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3_ota_bridge]
extends = minimal_ota_bridge_base
board = esp32-c3-devkitm-1
build_flags =
    ${minimal_ota_bridge_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
