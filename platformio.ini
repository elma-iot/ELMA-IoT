; VIEWE UEDX24320028E-WB-A V1.1: official panel profile, Arduino 2.0.17.
[env:viewe_uedx24320028e]
lib_ignore =
extends = env:esp32s3_notifier_hacs
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/ota_16m.csv
build_unflags =
    ${env:esp32_notifier.build_unflags}
    -DAPP_DEFAULT_STATUS_LED_PIN=10
    -DAPP_DEFAULT_BATTERY_ADC_PIN=3
build_flags =
    ${env:esp32s3_notifier_hacs.build_flags}
    -DAPP_DEFAULT_STATUS_LED_PIN=255
    -DAPP_DEFAULT_BATTERY_ADC_PIN=0
    -DAPP_HAS_ONBOARD_PANEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DESP_PANEL_BOARD_FILE_SKIP=1
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DESP_PANEL_DRIVERS_FILE_SKIP=1
    -DESP_PANEL_DRIVERS_BUS_USE_SPI=1
    -DESP_PANEL_DRIVERS_BUS_USE_I2C=1
    -DESP_PANEL_DRIVERS_BUS_COMPILE_UNUSED_DRIVERS=0
    -DESP_PANEL_DRIVERS_LCD_COMPILE_UNUSED_DRIVERS=0
    -DESP_PANEL_DRIVERS_TOUCH_USE_CHSC6540=1
    -DESP_PANEL_DRIVERS_TOUCH_COMPILE_UNUSED_DRIVERS=0
    -DESP_PANEL_DRIVERS_BACKLIGHT_USE_PWM_LEDC=1
    -DESP_PANEL_DRIVERS_BACKLIGHT_COMPILE_UNUSED_DRIVERS=0

