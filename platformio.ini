[platformio]
; Switch the active build target by uncommenting one profile below.
; default_envs = esp32_notifier
; default_envs = esp32_notifier_hacs
; default_envs = esp32_notifier_hacs_slim
; default_envs = esp32s3_notifier
default_envs = esp32s3_notifier_hacs
; default_envs = esp32_notifier

[common]
common_build_flags =
    -Wall
    -Wextra
    -Wno-missing-field-initializers
    -std=gnu++2a
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--print-memory-usage
common_cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

[env:esp32_notifier]
lib_ignore =
    ESP32_Display_Panel
    ESP32_IO_Expander
    esp-lib-utils
    lvgl
platform = espressif32 @ ^6.7.0
board = esp32dev
framework = arduino
; upload_port and monitor_port are intentionally omitted so PlatformIO can
; auto-discover the connected ESP32 serial adapter instead of hardcoding COMx.
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions/ota_4m.csv
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.7.6
    marvinroger/AsyncMqttClient @ ^0.9.0
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/RTClib @ 2.1.4
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit SSD1306 @ ^2.5.11
    adafruit/Adafruit SH110X @ ^2.1.12
build_flags =
    ${common.common_build_flags}
    -DAPP_DEBUG=1
build_unflags =
    -std=gnu++11
    -fno-lto
extra_scripts =
    pre:scripts/project_version.py
    pre:scripts/wifi_power_defaults.py
    pre:scripts/asset_embed.py
    pre:scripts/patch_audio_prebuffer.py
board_build.cmake_extra_args =
    ${common.common_cmake_extra_args}

[env:esp32_notifier_hacs]
extends = env:esp32_notifier
build_flags =
    ${common.common_build_flags}
    -DAPP_DEBUG=0
    -DAPP_ENABLE_HACS_MQTT=1

[env:esp32_notifier_hacs_slim]
extends = env:esp32_notifier
build_flags =
    ${common.common_build_flags}
    -DAPP_DEBUG=0
    -DAPP_DISABLE_WEB_UI=1
    -DAPP_ENABLE_HACS_MQTT=1

; Fits devices made by ELMA v0.1.10/v0.1.11 whose 4 MB partition table has
; 0x190000-byte OTA slots. Runtime features and APIs remain available, while
; the large illustrated browser frontend is replaced by a recovery page.
[env:esp32_notifier_hacs_legacy_ota]
extends = env:esp32_notifier_hacs
build_unflags =
    -std=gnu++11
    -fno-lto
build_flags =
    ${env:esp32_notifier_hacs.build_flags}
    -DAPP_LEGACY_OTA_FIT=1
    -flto

[env:esp32c3_designer]
lib_ignore =
    ESP32_Display_Panel
    ESP32_IO_Expander
    esp-lib-utils
    lvgl
platform = espressif32 @ ^6.7.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions/ota_4m.csv
build_src_filter = +<*> -<audio_player.cpp>
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.7.6
    marvinroger/AsyncMqttClient @ ^0.9.0
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/RTClib @ 2.1.4
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit SSD1306 @ ^2.5.11
    adafruit/Adafruit SH110X @ ^2.1.12
build_flags =
    ${common.common_build_flags}
    -DAPP_DEBUG=0
    -DAPP_DISABLE_AUDIO=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    '-DAPP_BOARD_PROFILE="esp32-c3"'
    -DAPP_DEFAULT_STATUS_LED_PIN=8
    -DAPP_STATUS_LED_IS_NEOPIXEL=1
    -DAPP_DEFAULT_BATTERY_ADC_PIN=0
    -DAPP_DEFAULT_OLED_ENABLED=0
    -DAPP_DEFAULT_OLED_SDA_PIN=4
    -DAPP_DEFAULT_OLED_SCL_PIN=5
extra_scripts =
    pre:scripts/project_version.py
    pre:scripts/wifi_power_defaults.py
    pre:scripts/asset_embed.py
board_build.cmake_extra_args =
    ${common.common_cmake_extra_args}
build_unflags =
    -std=gnu++11
    -fno-lto

[env:esp32c3_designer_hacs]
extends = env:esp32c3_designer
build_flags =
    ${env:esp32c3_designer.build_flags}
    -DAPP_ENABLE_HACS_MQTT=1

[env:esp32c3_designer_slim]
